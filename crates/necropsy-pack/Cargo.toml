[package]
name = "necropsy-pack"
description = "Puzzle pack format shared by the necropsy web and CLI front ends"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
regex = "1"
wasmi = "2"
hmac = "0.12"

[dev-dependencies]
necropsy-gen-sdk = { path = "../necropsy-gen-sdk" }
wat = "1"
