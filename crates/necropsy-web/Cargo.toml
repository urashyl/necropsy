[package]
name = "necropsy-web"
description = "Web front end for necropsy puzzle packs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
necropsy-pack = { path = "../necropsy-pack" }
axum = "0.8"
maud = { version = "0.27", features = ["axum"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = ["html", "parsing", "default-syntaxes", "regex-fancy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
argon2 = "0.6.0"
getrandom = "0.4.3"
base64 = "0.22"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
regex = "1"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
