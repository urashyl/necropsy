[package]
name = "necropsy-spawner"
description = "Starts and reaps the sandboxed containers behind container-backed live puzzles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
necropsy-pack = { path = "../necropsy-pack" }
tower = { version = "0.5", features = ["util"] }
