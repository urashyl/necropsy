# Deploys main (to "production") and dev (to "development") once the checks
# pass: builds the Docker image here, sends it to the server over SSH, and runs
# deploy/bluegreen/deploy.sh there, which starts the new version beside the old
# one and switches traffic only after it is healthy.
#
# Needs the secrets listed in docs/ci-cd.md, stored on each environment. Each
# environment only accepts deploys from its own branch. Nothing about the
# server is written in this file.
name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time per branch, and never cancel one that is already running.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    # A manual run from another branch must not deploy it.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Check configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. See docs/ci-cd.md."
            exit 1
          fi
          if ! [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || [ "$DEPLOY_PORT" -lt 1 ] || [ "$DEPLOY_PORT" -gt 65535 ]; then
            echo "::error::DEPLOY_PORT must be a number from 1 to 65535."
            exit 1
          fi
          # These end up in an ssh config file and a remote command line.
          if ! [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]*$ ]]; then
            echo "::error::DEPLOY_HOST must be a hostname or IP address."
            exit 1
          fi
          if ! [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
            echo "::error::DEPLOY_USER is not a valid user name."
            exit 1
          fi
          path="${DEPLOY_PATH:-necropsy-deploy}"
          if ! [[ "$path" =~ ^[A-Za-z0-9._/-]+$ ]] || [ "$path" = / ] || [ "$path" = . ] || [ "$path" = .. ]; then
            echo "::error::DEPLOY_PATH may only use letters, digits, . _ / - and must not be / or .."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tag
        id: tag
        run: echo "tag=necropsy:$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.tag.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/necropsy-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts_deploy
          cat > ~/.ssh/config <<CONFIG
          Host necropsy-deploy
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts_deploy
            ConnectTimeout 20
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Upload image
        run: |
          gzip -c "$RUNNER_TEMP/necropsy-image.tar" | ssh necropsy-deploy docker load

      - name: Upload deploy files
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          dir="${DEPLOY_PATH:-necropsy-deploy}"
          # Replace the previous copy so files removed from the repo go away.
          tar -czf - --exclude=deploy/bluegreen/test deploy/bluegreen .env.example \
            | ssh necropsy-deploy "rm -rf -- '$dir/deploy' '$dir/.env.example' && mkdir -p -- '$dir' && tar -xzf - -C '$dir'"

      - name: Switch traffic
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ steps.tag.outputs.tag }}
        run: |
          dir="${DEPLOY_PATH:-necropsy-deploy}"
          ssh necropsy-deploy "'$dir/deploy/bluegreen/deploy.sh' '$IMAGE'"

      - name: Health check
        if: vars.DEPLOY_HEALTHCHECK_URL != ''
        env:
          URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$URL" >/dev/null; then
              echo "healthy: $URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$URL did not return success after deploying."
          exit 1
