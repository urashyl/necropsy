# Deploys main to the server once the checks pass. It connects over SSH and
# asks the server's root-owned necropsy-deploy program, through sudo, to deploy
# this commit. The program does the rest: it builds the image and starts the
# new version beside the old one, switching traffic only after it is healthy.
#
# Needs the secrets listed in docs/ci-cd.md, stored on the "production"
# environment. Nothing about the server is written in this file.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one that is already running.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    # A manual run from another branch must not deploy it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Check configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. See docs/ci-cd.md."
            exit 1
          fi
          if ! [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || [ "$DEPLOY_PORT" -lt 1 ] || [ "$DEPLOY_PORT" -gt 65535 ]; then
            echo "::error::DEPLOY_PORT must be a number from 1 to 65535."
            exit 1
          fi
          # These end up in an ssh config file.
          if ! [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]*$ ]]; then
            echo "::error::DEPLOY_HOST must be a hostname or IP address."
            exit 1
          fi
          if ! [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
            echo "::error::DEPLOY_USER is not a valid user name."
            exit 1
          fi

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts_deploy
          cat > ~/.ssh/config <<CONFIG
          Host necropsy-deploy
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts_deploy
            ConnectTimeout 20
            ServerAliveInterval 30
          CONFIG
          chmod 600 ~/.ssh/config

      # The only thing the deploy user may run as root, without a password, is
      # the installed necropsy-deploy, and for this it takes a commit hash. The
      # server fetches the repository itself, refuses a commit that is not on
      # main, builds the image, and switches traffic only once it is healthy.
      - name: Deploy
        env:
          SHA: ${{ github.sha }}
        run: |
          ssh necropsy-deploy "sudo -n necropsy-deploy deploy $SHA"

      - name: Health check
        if: vars.DEPLOY_HEALTHCHECK_URL != ''
        env:
          URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$URL" >/dev/null; then
              echo "healthy: $URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$URL did not return success after deploying."
          exit 1
