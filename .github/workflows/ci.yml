# Checks that must pass before anything is deployed: formatting, lints, tests.
# Runs on pull requests and on pushes to every branch except main and dev.
# Pushes to those run it through deploy.yml instead, which calls this workflow
# and then deploys.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, dev]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Pack validation
        run: cargo run --locked -q -p necropsy-pack --bin pack-tool -- validate packs

      # Generated packs (docs/generators.md). The generators' own tests, then
      # every generator over many seeds, then a rebuild of each generator.wasm
      # from its source with the pinned toolchain (packs/rust-toolchain.toml,
      # installed by rustup on first use), which must match the committed one.
      - name: Generators
        run: |
          (cd packs && rustup toolchain install)
          for d in packs/*/generator; do (cd "$d" && cargo test --locked -q); done
          cargo run --locked -q -p necropsy-pack --bin pack-tool -- check-gen packs
          cargo run --locked -q -p necropsy-pack --bin pack-tool -- gen-build --check packs

      - name: Toolkit scripts (node)
        run: |
          node --version
          node --test crates/necropsy-web/tests-js/*.test.mjs
          for f in crates/necropsy-web/static/app.js crates/necropsy-web/static/toolkit/*.js; do
            node --check "$f"
          done
          python3 -m py_compile crates/necropsy-web/static/toolkit/necropsy.py tools/learn/build.py tools/learn/pcaplib.py

      - name: Script syntax
        run: |
          for f in toolkit/fetch.sh deploy/install.sh deploy/bluegreen/deploy.sh deploy/bluegreen/install-system.sh deploy/bluegreen/test/run.sh \
                   deploy/install-site.sh deploy/install-range.sh deploy/lib/common.sh \
                   deploy/test/common.sh deploy/test/install-site.sh deploy/test/install-range.sh \
                   deploy/range/ci-test.sh deploy/range/update.sh deploy/test/range-update.sh range/build.sh range/webshell-lab/entrypoint.sh range/webshell-lab/test.sh \
                   range/local-test.sh range/implant-lab/entrypoint.sh range/implant-lab/test.sh range/elf-lab/entrypoint.sh range/elf-lab/test.sh range/hidden-process-lab/entrypoint.sh range/hidden-process-lab/test.sh; do
            bash -n "$f"
          done

      - name: Lab code (no Docker)
        run: |
          python3 -m py_compile range/implant-lab/server.py range/implant-lab/solve.py range/elf-lab/server.py range/elf-lab/solve.py
          range/local-test.sh

      - name: VM installers
        run: |
          deploy/test/common.sh
          deploy/test/install-site.sh
          deploy/test/install-range.sh
          deploy/test/range-update.sh

      # As root, so the tests of the real install (clean environment, no
      # `switch`, https only, root-owned settings) run too. They use a fake
      # docker, so nothing touches this machine's Docker.
      - name: Deploy program and installer
        run: sudo env "PATH=$PATH" deploy/bluegreen/test/run.sh

  # Builds the real image and runs it the way production does: read-only root,
  # no capabilities, a fresh volume for the database.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: necropsy:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose file is valid
        working-directory: deploy/bluegreen
        env:
          NECROPSY_ENV_FILE: ${{ github.workspace }}/.env.example
          NECROPSY_PROXY_DIR: ${{ runner.temp }}
          BLUE_IMAGE: necropsy:ci
        run: docker compose config --quiet

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 18080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e NECROPSY_BASE_URL=http://localhost:18080 \
            necropsy:ci
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && break
            sleep 2
          done
          if [ "$status" != healthy ]; then
            echo "::error::container is $status"
            docker ps -a
            docker inspect -f '{{json .State}}' smoke
            docker logs smoke
            exit 1
          fi
          curl -fsS http://localhost:18080/healthz
          curl -fsS http://localhost:18080/ | grep -q necropsy
          # The Learn modules and the workspace's tools are in the image.
          curl -fsS http://localhost:18080/learn/reading-a-pcap | grep -q 'Walkthrough'
          for tool in wiregasm pyodide cyberchef; do
            v=$(awk -v t="$tool" '$1 == t { print $2 }' toolkit/sources.txt)
            case "$tool" in
              wiregasm) f=wiregasm.wasm ;; pyodide) f=pyodide.asm.wasm ;; cyberchef) f=index.html ;;
            esac
            curl -fsS -o /dev/null -H 'Accept-Encoding: gzip' "http://localhost:18080/toolkit/$tool-$v/$f"
          done
          curl -fsS http://localhost:18080/w/learn-first-capture | grep -q 'data-wiregasm='
          # First run creates the admin and prints its credentials once.
          docker logs smoke 2>&1 | grep -q 'first run'
          # Not root.
          user=$(docker inspect -f '{{.Config.User}}' necropsy:ci)
          case "$user" in ''|0|root|0:*|root:*) echo "::error::runs as '$user'"; exit 1 ;; esac
          # SIGINT stops it cleanly (the image's STOPSIGNAL).
          docker stop -t 15 smoke >/dev/null
          [ "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0 ]

      - name: Logs on failure
        if: failure()
        run: docker logs smoke || true

  # The range, with real Docker: runs the real spawner with two tenants, pushes
  # the lab images over its API, and checks every lab comes up locked down (no
  # network, read-only root, no capabilities, limits), answers through the
  # proxy, passes its own test, is reaped when its time is up, that a full
  # range refuses another, and that tenants cannot touch each other. This is
  # the part that cannot be checked with a fake docker.
  range:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the spawner
        run: cargo build --release --locked -p necropsy-spawner

      - name: The range
        run: sudo env "PATH=$PATH" deploy/range/ci-test.sh

  # The real thing, with real Docker: installs the deploy program, deploys twice
  # (so both colors and the Caddy switch run) while requesting the site
  # continuously, rolls back, and checks the client address gets through the
  # whole chain. A local repository stands in for GitHub.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PORT: "18090"
      DEPLOY: /usr/local/bin/necropsy-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the deploy program
        run: |
          git clone --bare . "$RUNNER_TEMP/origin.git"
          git -C "$RUNNER_TEMP/origin.git" update-ref refs/heads/main "$(git rev-parse HEAD)"
          git -C "$RUNNER_TEMP/origin.git" symbolic-ref HEAD refs/heads/main
          # The runner user is in the docker group, which a real deploy user is not.
          sudo deploy/bluegreen/install-system.sh --unsafe-for-tests --allow-docker-group \
            --user "$USER" --repo "file://$RUNNER_TEMP/origin.git"
          printf 'NECROPSY_PORT=%s\nDRAIN_SECONDS=3\nHEALTH_TIMEOUT=120\n' "$PORT" \
            | sudo tee -a /etc/necropsy/deploy.env >/dev/null

      - name: First deploy
        run: |
          sudo "$DEPLOY" deploy "$(git rev-parse HEAD)"
          curl -fsS "http://127.0.0.1:$PORT/healthz"
          curl -fsS "http://127.0.0.1:$PORT/" | grep -q necropsy
          sudo "$DEPLOY" status
          sudo "$DEPLOY" status | grep -q '^live:    blue'

      - name: Second deploy under load, with no failed request
        run: |
          : > "$RUNNER_TEMP/fails"; : > "$RUNNER_TEMP/oks"; : > "$RUNNER_TEMP/slow"
          (
            while true; do
              # Record what each failure was (curl's exit code, the HTTP status
              # and how long it took), and any slow request, so a rare failure
              # explains itself in the log.
              res=$(curl -sS -m 3 -o /dev/null -w '%{http_code} %{time_total}' "http://127.0.0.1:$PORT/healthz" 2>&1)
              rc=$?
              if [ "$rc" = 0 ] && [ "${res%% *}" = 200 ]; then
                echo ok >> "$RUNNER_TEMP/oks"
                case "${res##* }" in 0.[0-9]*|1.[0-9]*) awk -v t="${res##* }" -v d="$(date +%T.%N)" 'BEGIN{if (t > 0.5) print d, "slow", t}' >> "$RUNNER_TEMP/slow" ;; esac
              else
                echo "$(date +%T.%N) exit=$rc $res" >> "$RUNNER_TEMP/fails"
              fi
              sleep 0.05
            done
          ) &
          hammer=$!
          sudo "$DEPLOY" deploy "$(git rev-parse HEAD)"
          kill "$hammer" || true
          sudo "$DEPLOY" status | grep -q '^live:    green'
          echo "requests during the deploy: $(wc -l < "$RUNNER_TEMP/oks") ok, $(wc -l < "$RUNNER_TEMP/fails") failed"
          [ "$(wc -l < "$RUNNER_TEMP/oks")" -gt 50 ]
          if [ -s "$RUNNER_TEMP/slow" ]; then echo "slow requests (over 0.5s):"; cat "$RUNNER_TEMP/slow"; fi
          if [ -s "$RUNNER_TEMP/fails" ]; then
            echo "::error::requests failed during the switch"
            cat "$RUNNER_TEMP/fails"
            exit 1
          fi

      - name: Rollback
        run: |
          sudo "$DEPLOY" rollback
          sudo "$DEPLOY" status | grep -q '^live:    blue'
          curl -fsS "http://127.0.0.1:$PORT/healthz"

      # 30 failed logins per address are allowed in 15 minutes, so the 31st from
      # one address is refused while another address is untouched. That only
      # holds if X-Real-IP survives the whole chain: Caddy believes it from this
      # (trusted) peer, and the app believes Caddy's.
      - name: Client address reaches the app
        run: |
          # A different username each time, so only the per-address limit applies
          # (there is also a limit of 10 per username).
          login() {
            curl -s -o /dev/null -w '%{http_code}' -H "X-Real-IP: $1" \
              -d "username=user$2&password=wrong" "http://127.0.0.1:$PORT/login"
          }
          for i in $(seq 1 30); do
            code=$(login 203.0.113.50 "$i")
            [ "$code" = 401 ] || { echo "attempt $i from one address got $code, not 401"; exit 1; }
          done
          code=$(login 203.0.113.50 31)
          [ "$code" = 429 ] || { echo "the 31st attempt from one address got $code, not 429"; exit 1; }
          code=$(login 198.51.100.7 32)
          [ "$code" = 401 ] || { echo "another address got $code, not 401"; exit 1; }

      # NECROPSY_BIND, for a reverse proxy on another host: the next deploy
      # recreates the proxy container on the new address.
      - name: Bind address change
        run: |
          echo NECROPSY_BIND=0.0.0.0 | sudo tee -a /etc/necropsy/deploy.env >/dev/null
          sudo "$DEPLOY" deploy "$(git rev-parse HEAD)"
          docker port necropsy-proxy 8080
          docker port necropsy-proxy 8080 | grep -qx "0.0.0.0:$PORT"
          host=$(hostname -I | awk '{print $1}')
          curl -fsS "http://$host:$PORT/healthz"
          curl -fsS "http://127.0.0.1:$PORT/healthz"

      - name: State on failure
        if: failure()
        run: |
          sudo "$DEPLOY" status || true
          docker ps -a
          docker logs necropsy-proxy 2>&1 | tail -40 || true
          docker logs necropsy-blue 2>&1 | tail -20 || true
          docker logs necropsy-green 2>&1 | tail -20 || true
          sudo cat /var/lib/necropsy/bluegreen/history.log || true

