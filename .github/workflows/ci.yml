# Checks that must pass before anything is deployed: formatting, lints, tests.
# Runs on pull requests and on pushes to every branch except main. Pushes to
# main run it through deploy.yml instead, which calls this workflow and then
# deploys.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Pack validation
        run: cargo run --locked -q -p necropsy-pack --bin pack-tool -- validate packs

      - name: Installer syntax
        run: bash -n deploy/install.sh
