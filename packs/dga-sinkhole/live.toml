ttl_minutes = 60
flag_prefix = "sink"

[[route]]
method = "GET"
path = "/"
[route.respond]
status = 200
content_type = "text/html; charset=utf-8"
body = '''<!doctype html><title>Sinkhole console</title><h2>Sinkhole console</h2>
<p>Registered by the sinkhole: any domain a sample is known to derive. Query with <code>/lookup?domain=NAME</code>.</p>
<p>Recovered sample: <a href="/dl/netcheck.js.txt">netcheck.js.txt</a></p>
'''

[[route]]
method = "GET"
path = "/dl/netcheck.js.txt"
[route.respond]
status = 200
content_type = "text/plain; charset=utf-8"
headers = { "content-disposition" = 'attachment; filename="netcheck.js.txt"' }
file = "netcheck.js.txt"

[[route]]
method = "GET"
path = "/lookup"
[route.when]
query = { domain = 'xsevkmhqcrbd.biz' }
[route.respond]
status = 200
content_type = "application/json"
body = '{"domain":"xsevkmhqcrbd.biz","status":"sinkholed","last_seen":"2026-12-24T06:11:09Z","hits":314,"analyst_note":"{{flag}}"}'

[[route]]
method = "GET"
path = "/lookup"
[route.when]
query = { domain = 'njbgxaducnhg.xyz' }
[route.respond]
status = 200
content_type = "application/json"
body = '{"domain":"njbgxaducnhg.xyz","status":"parked","note":"held by a security vendor, not the operator"}'

[[route]]
method = "GET"
path = "/lookup"
[route.when]
query = { domain = "*" }
[route.respond]
status = 200
content_type = "application/json"
body = '{"status":"NXDOMAIN"}'

[[route]]
method = "GET"
path = "/lookup"
[route.respond]
status = 400
content_type = "application/json"
body = '{"error":"missing domain"}'
