# Proxy in front of the blue and green containers. The files under
# /etc/nginx/necropsy are written by deploy.sh:
#   edge.conf      which peers may tell us the client address (your own proxy)
#   upstream.conf  the live color, as: server necropsy-blue:8080;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Log the path only. Email links carry one-time tokens in the query string.
  log_format necropsy '$remote_addr "$request_method $uri" $status $body_bytes_sent';
  access_log /dev/stdout necropsy;

  # Take the client address from X-Real-IP only when the connection comes from
  # your own proxy; otherwise $remote_addr stays the real peer.
  include /etc/nginx/necropsy/edge.conf;
  real_ip_header X-Real-IP;

  upstream necropsy {
    include /etc/nginx/necropsy/upstream.conf;
    keepalive 16;
  }

  server {
    listen 8080;
    client_max_body_size 16k;

    location / {
      proxy_pass http://necropsy;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      # Always overwritten: the app trusts this header from us, so it must be
      # the address we worked out above, never a client-supplied value.
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      # A request that never reached a live upstream can safely go to the other
      # attempt, which covers the instant of a switch.
      proxy_next_upstream error timeout;
    }
  }
}
