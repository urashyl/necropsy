# Blue-green stack for necropsy. Do not run this by hand: deploy.sh drives it,
# supplies the variables below, and decides which color is live.
#
#   proxy ──► necropsy-blue   (Caddy; one of these two serves traffic;
#         └─► necropsy-green   the other is stopped or draining)
#
# The proxy is the only thing published to the host, on loopback. Your own
# reverse proxy points at it.

# The stack's name. A host can run several (production and dev, say): the
# project, container and volume names all follow it. necropsy-deploy sets it.
name: ${NECROPSY_NAME:-necropsy}

x-app: &app
  restart: unless-stopped
  env_file:
    - ${NECROPSY_ENV_FILE:?set by deploy.sh}
  # Fixed here, after env_file, so settings written for a bare-metal install
  # cannot break the container: it must listen on all interfaces and trust only
  # the proxy for the client address header.
  environment:
    NECROPSY_ADDR: 0.0.0.0:8080
    NECROPSY_CLIENT_IP_HEADER: X-Real-IP
    NECROPSY_TRUSTED_PROXIES: ${NECROPSY_SUBNET:-172.30.30.0/24}
  volumes:
    - data:/data
    # The spawner's socket and each live instance's socket (docs/range.md). A
    # directory on the host that necropsy-spawner keeps; empty and unused
    # unless container puzzles are set up.
    - ${NECROPSY_RANGE_HOST_DIR:-/run/necropsy}:/run/necropsy
  networks: [internal]
  # Never root, whatever the image says. Matches the image's own user, and the
  # owner of the data volume.
  user: "65532:65532"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  stop_grace_period: 20s

services:
  necropsy-blue:
    <<: *app
    image: ${BLUE_IMAGE:-necropsy:unset}
    container_name: ${NECROPSY_NAME:-necropsy}-blue

  necropsy-green:
    <<: *app
    image: ${GREEN_IMAGE:-necropsy:unset}
    container_name: ${NECROPSY_NAME:-necropsy}-green

  proxy:
    image: caddy:2-alpine
    container_name: ${NECROPSY_NAME:-necropsy}-proxy
    restart: unless-stopped
    # Loopback only unless deploy.env sets NECROPSY_BIND. The long form takes
    # an IPv6 address without brackets.
    ports:
      - target: 8080
        published: "${NECROPSY_PORT:-8080}"
        host_ip: "${NECROPSY_BIND:-127.0.0.1}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # A directory, not single files: deploy.sh swaps files in it atomically,
      # and a bind-mounted file would keep pointing at the old one.
      - ${NECROPSY_PROXY_DIR:?set by deploy.sh}:/etc/caddy/necropsy:ro
    environment:
      # Caddy wants to write state; there is nowhere to, and no need to.
      XDG_DATA_HOME: /tmp/caddy-data
      XDG_CONFIG_HOME: /tmp/caddy-config
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    # The caddy binary carries a file capability for low ports, and a process
    # cannot start it without that capability in its set, even though this
    # proxy only listens on 8080. It is the only one kept.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128

networks:
  internal:
    ipam:
      config:
        - subnet: ${NECROPSY_SUBNET:-172.30.30.0/24}

volumes:
  data:
    name: ${NECROPSY_NAME:-necropsy}-data
